name: build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Select build target"
        required: true
        type: choice
        default: all
        options:
          - all
          - binary
          - dynbinary
          - windows
          - windows-docker

jobs:

  # =========================
  # PREPARE (unchanged)
  # =========================
  prepare:
    if: ${{ github.event.inputs.build_target != 'windows' && github.event.inputs.build_target != 'windows-docker' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create matrix
        id: platforms
        run: |
          echo "matrix=$(docker buildx bake cross --print | jq -cr '.target."cross".platforms')" >>${GITHUB_OUTPUT}

  # =========================
  # LINUX BUILD
  # =========================
  build:
    if: ${{ github.event.inputs.build_target != 'windows' && github.event.inputs.build_target != 'windows-docker' }}
    runs-on: ubuntu-24.04
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event.inputs.build_target == 'all' && fromJson('["binary","dynbinary"]') || fromJson(format('["{0}"]', github.event.inputs.build_target)) }}
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
        use_glibc:
          - ""
          - glibc

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/bake-action@v6
        with:
          targets: ${{ matrix.target }}
          set: |
            *.platform=${{ matrix.platform }}
        env:
          USE_GLIBC: ${{ matrix.use_glibc }}

      - name: Package
        working-directory: ./build
        run: |
          mkdir -p /tmp/out
          platform=${{ matrix.platform }}
          platformPair=${platform//\//-}
          tar -czf "/tmp/out/docker-${platformPair}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: docker-${{ matrix.platform }}
          path: /tmp/out/*

  # =========================
  # PLUGINS
  # =========================
  prepare-plugins:
    if: ${{ github.event.inputs.build_target != 'windows' && github.event.inputs.build_target != 'windows-docker' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create matrix
        id: platforms
        run: |
          echo "matrix=$(docker buildx bake plugins-cross --print | jq -cr '.target."plugins-cross".platforms')" >>${GITHUB_OUTPUT}

  plugins:
    if: ${{ github.event.inputs.build_target != 'windows' && github.event.inputs.build_target != 'windows-docker' }}
    runs-on: ubuntu-24.04
    needs: prepare-plugins
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare-plugins.outputs.matrix) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/bake-action@v6
        with:
          targets: plugins-cross
          set: |
            *.platform=${{ matrix.platform }}

  windows-native:
    if: ${{ github.event.inputs.build_target == 'windows' || github.event.inputs.build_target == 'all' }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24

      - name: Set environment
        run: |
          setx GO111MODULE auto

      - name: Build Docker CLI
        shell: pwsh
        run: |
          $env:GO111MODULE="auto"
          $TARGET = "docker.exe"
          $SOURCE = ".\cli\command"
          $GO_BUILDTAGS = ""
          $GO_LDFLAGS = "-s -w"
          go build -trimpath -tags $GO_BUILDTAGS -ldflags $GO_LDFLAGS -o $TARGET $SOURCE

      - name: Copy versioned binary
        shell: pwsh
        run: |
          copy docker.exe docker-v${{ env.VERSION }}.exe

      - name: Verify binaries
        shell: pwsh
        run: |
          dir .\docker*.exe

      - name: Upload Windows exe artifacts
        uses: actions/upload-artifact@v6
        with:
          name: docker-windows-amd64
          path: |
            docker.exe
            docker-v${{ env.VERSION }}.exe


  windows-docker:
    if: ${{ github.event.inputs.build_target == 'windows-docker' || github.event.inputs.build_target == 'all' }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Windows Docker CLI
        run: |
          docker buildx bake cross --set "*.platform=windows/amd64" 

      - name: List built binaries
        run: docker run --rm <image_name> dir C:\path\to\output  # adjust path if needed

      - name: Upload Windows Docker artifacts
        uses: actions/upload-artifact@v6
        with:
          name: docker-windows-docker
          path: ./build/*   # adjust to match your Docker output
