name: build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Select build target"
        required: true
        type: choice
        default: windows
        options:
          - all
          - binary
          - dynbinary
          - windows
          - windows-docker

jobs:

  # =========================
  # PREPARE (unchanged)
  # =========================
  prepare:
    if: ${{ github.event.inputs.build_target != 'windows' && github.event.inputs.build_target != 'windows-docker' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create matrix
        id: platforms
        run: |
          echo "matrix=$(docker buildx bake cross --print | jq -cr '.target."cross".platforms')" >>${GITHUB_OUTPUT}

  # =========================
  # LINUX BUILD
  # =========================
  build:
    if: ${{ github.event.inputs.build_target != 'windows' && github.event.inputs.build_target != 'windows-docker' }}
    runs-on: ubuntu-24.04
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event.inputs.build_target == 'all' && fromJson('["binary","dynbinary"]') || fromJson(format('["{0}"]', github.event.inputs.build_target)) }}
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
        use_glibc:
          - ""
          - glibc

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/bake-action@v6
        with:
          targets: ${{ matrix.target }}
          set: |
            *.platform=${{ matrix.platform }}
        env:
          USE_GLIBC: ${{ matrix.use_glibc }}

      - name: Package
        working-directory: ./build
        run: |
          mkdir -p /tmp/out
          platform=${{ matrix.platform }}
          platformPair=${platform//\//-}
          tar -czf "/tmp/out/docker-${platformPair}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: docker-${{ matrix.platform }}
          path: /tmp/out/*

  # =========================
  # PLUGINS
  # =========================
  prepare-plugins:
    if: ${{ github.event.inputs.build_target != 'windows' && github.event.inputs.build_target != 'windows-docker' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create matrix
        id: platforms
        run: |
          echo "matrix=$(docker buildx bake plugins-cross --print | jq -cr '.target."plugins-cross".platforms')" >>${GITHUB_OUTPUT}

  plugins:
    if: ${{ github.event.inputs.build_target != 'windows' && github.event.inputs.build_target != 'windows-docker' }}
    runs-on: ubuntu-24.04
    needs: prepare-plugins
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare-plugins.outputs.matrix) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/bake-action@v6
        with:
          targets: plugins-cross
          set: |
            *.platform=${{ matrix.platform }}

  windows-native:
    if: ${{ github.event.inputs.build_target == 'windows' || github.event.inputs.build_target == 'all' }}
    runs-on: windows-2022

    steps:
      - name: Set up GOPATH
        run: |
          setx GOPATH "%USERPROFILE%\go"
          set GOPATH "%USERPROFILE%\go"
          echo "GOPATH=%USERPROFILE%\go" >> $GITHUB_ENV

      - name: Clone repo into GOPATH
        run: |
          set GOPATH "%USERPROFILE%\go"
          mkdir -p "%GOPATH%\src\github.com\docker"
          git clone https://github.com/docker/cli.git "%GOPATH%\src\github.com\docker\cli"
          cd "%GOPATH%\src\github.com\docker\cli"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24

      - name: Build Windows CLI
        run: |
          set GOPATH "%USERPROFILE%\go"
          set GO111MODULE=off
          cd "%GOPATH%\src\github.com\docker\cli"         
          go build -trimpath -ldflags "-s -w" -o cli/docker.exe ./cli/command

      - name: Create versioned binary
        run: copy cli\docker.exe cli\docker-v%VERSION%.bravura-1.exe

      - name: Verify binary
        run: dir cli\docker.exe

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v6
        with:
          name: docker-windows-amd64
          path: |
            cli\docker.exe
            cli\docker-v%VERSION%.bravura-1.exe


  windows-docker:
    if: ${{ github.event.inputs.build_target == 'windows-docker' || github.event.inputs.build_target == 'all' }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Windows Docker CLI
        run: |
          docker buildx bake cross --set "*.platform=windows/amd64" 

      - name: List built binaries
        run: docker run --rm <image_name> dir C:\path\to\output  # adjust path if needed

      - name: Upload Windows Docker artifacts
        uses: actions/upload-artifact@v6
        with:
          name: docker-windows-docker
          path: ./build/*   # adjust to match your Docker output
